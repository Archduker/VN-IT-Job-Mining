[project]
name = "vn-it-job-mining"
version = "0.1.0"
description = "Data collection pipeline for mining IT recruitment data in Vietnam"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "UTH Data Mining Team", email = "team@uth.edu.vn" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: hàm nhỏ, không đọc data/, không mạng (tests/unit/)",
    "integration: API monitoring và script với tmp_path (tests/integration/)",
    "contract: crawler đạt tiêu chuẩn collection C1–C14, offline (tests/contract/)",
    "needs_data(*paths): cần data/ hoặc reports/ thật; skip khi thiếu đường dẫn",
    "live: cào hoặc gọi R2 thật; chỉ chạy với --run-live",
]

[tool.coverage.run]
source = ["collection"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]   # Line too long — handled separately

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
