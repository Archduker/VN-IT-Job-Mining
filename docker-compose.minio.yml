services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: vn_it_jobs_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/mnt/data
      - type: bind
        source: ${MINIO_LICENSE_PATH:-./secrets/minio.license}
        target: /minio.license
        read_only: true
    command: server /mnt/data --license /minio.license --console-address ":9001"

volumes:
  minio_data:
