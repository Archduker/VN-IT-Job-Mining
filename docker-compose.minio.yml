services:
  minio:
    image: elestio/minio:latest
    container_name: vn_it_jobs_minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    # No curl-based healthcheck: the selected server image may not include curl.
    # The minio-init helper polls the HTTP health endpoint itself.
    healthcheck:
      disable: true

  minio-init:
    image: vn-it-jobs-minio-init:local
    build:
      context: ./docker/minio-init
      dockerfile: Dockerfile
    container_name: vn_it_jobs_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vn-it-jobs}
      MINIO_WAIT_SECONDS: ${MINIO_WAIT_SECONDS:-120}

volumes:
  minio_data:
    driver: local
