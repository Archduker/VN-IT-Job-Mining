services:
  minio:
    image: elestio/minio:latest
    container_name: vn_it_jobs_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./vn-it-jobs:/data   # ✅ Trỏ trực tiếp thư mục vn-it-jobs ra gốc /data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: elestio/minio:latest
    container_name: vn_it_jobs_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo '[Init] Đang cấu hình MinIO Client nội bộ...' &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/vn-it-jobs &&
      mc anonymous set download local/vn-it-jobs &&
      echo '[Init] Bucket vn-it-jobs đã sẵn sàng cho cả team!' &&
      exit 0;
      "